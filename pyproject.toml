[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allbench-lora"
version = "0.1.0"
description = "Traceable offline LoRA image evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
encode = ["torch>=2.2", "torchvision>=0.17", "transformers>=4.40,<5"]

[project.scripts]
allbench = "allbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
